[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover6"
version = "0.1.0"
description = "Numerical search for the largest square coverable by 6 unit squares (S(6))."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "shapely>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cover6 = "cover6.__main__:main"

[tool.setuptools.packages.find]
include = ["cover6*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
