[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover6"
version = "0.1.0"
description = "Proof attempt and numerical toolkit for S(6): covering a square by 6 unit squares."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cover6 = "cover6.__main__:main"

[tool.setuptools.packages.find]
include = ["cover6*", "proof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
